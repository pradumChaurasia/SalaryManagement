version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: acc
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://root:rootpass@db:3306/acc"
      PORT: 3000
      AUTH_ENABLED: "false"
    depends_on:
      - db
    volumes:
      - ./backend:/usr/src/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db-data:
